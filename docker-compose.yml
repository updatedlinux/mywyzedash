services:
  wyze-dvr:
    build: .
    container_name: wyze-dvr
    ports:
      - "3000:3000"
    environment:
      RECORDINGS_PATH: /recordings
      BRIDGE_HOST: ${BRIDGE_HOST:-192.168.88.37}
      HLS_PORT: ${HLS_PORT:-5080}
      RTSP_PORT: ${RTSP_PORT:-8554}
      HLS_PATH: ${HLS_PATH:-/hls/{camera}.m3u8}
      PORT: 3000
      RECORDING_TZ_OFFSET_HOURS: ${RECORDING_TZ_OFFSET_HOURS:-4}
    volumes:
      - ${RECORDINGS_PATH:-/Volumes/WyzeNVR/wyze-bridge/recordings}:/recordings:ro
    restart: unless-stopped
